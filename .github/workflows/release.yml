name: Release

on:
  push:
    tags:
      - v**

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-release:
    uses: zotero-plugin-dev/workflows/.github/workflows/release-plugin.yml@main
    # You can customize any of the inputs here.
    # If you omit an input, its default value will be used.
    with:
      build: "pnpm run build"
      release: |
        pnpm run release
        gh release upload "$GITHUB_REF_NAME" .scaffold/build/install-runtime.py .scaffold/build/install-runtime.py.sha256 --clobber
    secrets: inherit
