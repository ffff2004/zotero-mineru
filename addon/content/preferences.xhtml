<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>
  <html:p data-l10n-id="pref-runtime-help"></html:p>
  <html:label for="mineru-runtime" data-l10n-id="pref-runtime"></html:label>
  <hbox>
    <html:input id="mineru-runtime" type="text" flex="1" />
    <button id="mineru-runtime-choose" data-l10n-id="pref-choose"></button>
    <button id="mineru-runtime-check" data-l10n-id="pref-check"></button>
  </hbox>
  <html:p id="mineru-runtime-status" style="white-space: pre-wrap"></html:p>
  <html:label for="mineru-config" data-l10n-id="pref-config"></html:label>
  <hbox>
    <html:input id="mineru-config" type="text" flex="1" />
    <button id="mineru-config-choose" data-l10n-id="pref-choose"></button>
    <button id="mineru-config-open" data-l10n-id="pref-open"></button>
    <button id="mineru-config-create" data-l10n-id="pref-create"></button>
    <button id="mineru-config-reset" data-l10n-id="pref-reset"></button>
  </hbox>
  <html:p id="mineru-config-effective"></html:p>
  <html:p data-l10n-id="pref-secret-help"></html:p>
  <html:label for="mineru-tier" data-l10n-id="pref-tier"></html:label>
  <html:select id="mineru-tier">
    <html:option value="flash">flash</html:option>
    <html:option value="basic">basic</html:option>
    <html:option value="standard">standard</html:option>
    <html:option value="advanced">advanced</html:option>
  </html:select>
  <html:label for="mineru-ocr" data-l10n-id="pref-ocr"></html:label>
  <html:select id="mineru-ocr">
    <html:option value="auto">auto</html:option>
    <html:option value="txt">txt</html:option>
    <html:option value="ocr">ocr</html:option>
  </html:select>
  <html:label
    ><html:input id="mineru-images" type="checkbox" /><html:span
      data-l10n-id="pref-images"
    ></html:span
  ></html:label>
  <html:label for="mineru-pages" data-l10n-id="pref-pages"></html:label>
  <html:input id="mineru-pages" type="text" placeholder="all" />
  <html:p data-l10n-id="pref-pages-help"></html:p>
</groupbox>
